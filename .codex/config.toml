# Codex 프로젝트 설정
#
# 주의: Codex 는 "신뢰된 프로젝트"에서만 이 파일을 읽습니다.
# 신뢰 등록 전에는 이 파일 전체가 무시됩니다. 둘 중 하나로 등록하세요.
#   1) 프로젝트에서 codex 를 처음 실행할 때 뜨는 신뢰 프롬프트에 동의
#   2) ~/.codex/config.toml 에 아래를 추가
#        [projects.'c:\myhome\project\my-app']
#        trust_level = "trusted"
#      경로는 소문자 + 백슬래시 + 작은따옴표. Codex 가 스스로 기록하는 형태입니다.
#      큰따옴표를 쓰면 \u 가 유니코드 이스케이프로 잡혀 TOML 파싱 에러가 납니다.
#
# 우선순위: CLI 플래그 > 프로필 > 이 파일 > ~/.codex/config.toml > 기본값

# 필요할 때만 승인을 요청합니다. 전부 직접 승인하려면 "untrusted".
approval_policy = "on-request"

# 작업 디렉토리 안에서는 쓰기 허용, 밖은 차단.
sandbox_mode = "workspace-write"

# AGENTS.md 로드 상한 (기본 32 KiB). 넘는 분량은 조용히 잘립니다.
project_doc_max_bytes = 32768

[sandbox_workspace_write]
# npm install / cargo fetch / pip install 을 승인 없이 돌리기 위해 열어 둡니다.
# 더 조이려면 false 로 바꾸세요. 그러면 네트워크가 필요할 때마다 승인을 요청합니다.
network_access = true
